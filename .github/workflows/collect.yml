name: Collect PRs and deploy dashboard

on:
  schedule:
    # GitHub's cron is best-effort and has dropped nearly every slot for this
    # repo. The hourly cadence actually comes from heartbeat.yml, which
    # dispatches this workflow; these entries are a fallback only.
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [repos.json, src/**, site/index.html]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Collect merged PRs and summarize
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          # Subscription auth: `claude setup-token`, stored as CLAUDE_CODE_OAUTH_TOKEN.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional alternative: an API key. If set, it is used instead of the subscription.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run collect
      - name: Commit updated data
        # Runs even if summarizing failed or was cancelled, so partial progress is kept.
        if: always()
        run: |
          git config user.name "war-room-bot"
          git config user.email "war-room-bot@users.noreply.github.com"
          git add site/data/prs.json
          git diff --cached --quiet || git commit -m "data: refresh merged PRs $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Ensure the heartbeat chain is alive
        # If no heartbeat run is running or queued, the chain has broken;
        # restart it so the hourly cadence resumes.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alive=$(gh run list --workflow heartbeat.yml --repo "$GITHUB_REPOSITORY" \
            --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length')
          if [ "$alive" = "0" ]; then
            echo "No heartbeat running; re-arming"
            gh workflow run heartbeat.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "Heartbeat alive ($alive run(s))"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
