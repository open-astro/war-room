name: Collect PRs and deploy dashboard

on:
  schedule:
    # GitHub runs cron on a best-effort basis and silently drops many slots
    # (we observed 2 firings in 9 hours). Scheduling every 10 minutes makes it
    # very likely at least one lands each hour. A run is ~1 minute and only
    # commits when data changed, so the extra firings are cheap.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [repos.json, src/**, site/index.html]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Collect merged PRs and summarize
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          # Subscription auth: `claude setup-token`, stored as CLAUDE_CODE_OAUTH_TOKEN.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional alternative: an API key. If set, it is used instead of the subscription.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run collect
      - name: Commit updated data
        # Runs even if summarizing failed or was cancelled, so partial progress is kept.
        if: always()
        run: |
          git config user.name "war-room-bot"
          git config user.email "war-room-bot@users.noreply.github.com"
          git add site/data/prs.json
          git diff --cached --quiet || git commit -m "data: refresh merged PRs $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
